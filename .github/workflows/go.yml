name: go

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: host (darwin/arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Check formatting and module tidiness
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
          go mod tidy -diff
      - name: Build host without cgo
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go build -tags pins ./internal/pins
      - name: Vet
        run: |
          go vet ./...
          go vet -tags pins ./internal/pins
      - name: Test
        run: go test ./...
