name: go-ios-vm
services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: goiosvm
      POSTGRES_DB: goiosvm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - evidence:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goiosvm -d goiosvm"]
      interval: 2s
      timeout: 2s
      retries: 20
    mem_limit: 512m
volumes:
  evidence:
