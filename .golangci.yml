version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - govet        # suspicious constructs
    - staticcheck  # static analyses
    - errcheck     # unchecked errors
    - unused       # dead code
    - ineffassign  # ineffective assignments
    - errorlint    # %w wrapping and errors.Is/As
    - err113       # sentinel and wrapped errors instead of ad hoc comparisons
    - bodyclose    # HTTP response bodies are closed
    - gosec        # security issues
    - contextcheck # inherited contexts
    - noctx        # HTTP requests carry a context
    - nilnil       # no simultaneous nil error and invalid value
    - gocritic     # performance and style bugs
    - prealloc     # slice preallocation
    - misspell     # typos
    - gocyclo      # cyclomatic complexity
    - wrapcheck    # errors from other packages are wrapped
    - musttag      # field tags on marshaled structs
    - tagliatelle  # struct tag naming
  settings:
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        # Flag errors are reported as usage errors with the command's name.
        - (*flag.FlagSet).Parse(
    tagliatelle:
      case:
        rules:
          json: snake
  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - path: _test\.go
        linters:
          - err113
          - errcheck
          - gocyclo
          - gosec
          - wrapcheck

formatters:
  enable:
    - gofmt
